name: Upstream Filter Synchronization

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/sources.txt'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/sync-filters.yml'

concurrency:
  group: sync-filters
  cancel-in-progress: false

jobs:
  sync-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate repository configuration & scripts
        run: ./scripts/validate.sh

      - name: Run offline regression tests
        run: ./tests/test_pipeline.sh

      - name: Fetch latest filter lists
        run: ./scripts/fetch_filters.sh

      - name: Generate AIO merged list
        run: ./scripts/merge_filters.sh

      - name: Update README dynamic table
        run: ./scripts/update_readme.sh

      - name: Validate build artifacts
        run: ./scripts/validate.sh --check-artifacts

      - name: Commit and push changes
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- filters/ AIO_Filter_List.txt build.log README.md
          if git diff --cached --quiet; then
            echo "No upstream changes detected. Skipping commit."
            exit 0
          fi
          git commit -m "chore(filters): auto-sync upstream filter lists [skip ci]" \
            -m "Automated routine triggered by GitHub Actions."
          git pull --rebase origin "$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"
